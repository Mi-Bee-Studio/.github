<svg class="tm" width="980" height="410" viewBox="0 0 980 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mi&amp;Bee Studio 专题视图 · 文档与门户：组织主页、mibee-docs、MiBee Eye 门户、技术博客与 Hugo 主题，共 5 个公开仓库">
      <style>
        .tm{font-family:'Cascadia Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;
          --bg:#0b0f16;--panel:#10161f;--edgest:#26313f;--fg:#e6edf3;--dim:#7d8b99;--frame:#1f2733;
          --cy:#22d3ee;--grn:#3fb950;--amb:#fbbf24;--vio:#c792ea}
        .win{fill:var(--bg);stroke:var(--frame);stroke-width:1}
        .t-title{font-size:12px;fill:var(--dim)}
        .t-badge{font-size:10.5px;fill:var(--grn);letter-spacing:.5px}
        .cmd{font-size:13px;fill:var(--fg)}
        .pr{fill:var(--grn);font-weight:700}
        .flag{fill:var(--cy)}
        .t-status{font-size:12px;fill:var(--dim)}
        .t-ok{fill:var(--grn)}
        .leg{font-size:11.5px;fill:#8b98a5}
        .col-label{font-size:11px;fill:#5b8c6a}
        .lbl-note{font-size:11px;fill:var(--dim)}
        .chip .box{fill:var(--panel);stroke:var(--edgest);stroke-width:1}
        .chip .nm2{font-size:12px;fill:var(--fg)}
        .chip .lg{font-size:11px;font-weight:700}
        .own.org{fill:var(--amb)}.own.xq{fill:var(--cy)}.own.mz{fill:var(--vio)}
        .f-line{font-size:12px;fill:#8b98a5}
        .f-sum{fill:var(--fg);font-weight:700}
        .sep{stroke:var(--frame);stroke-width:1}
        .sep-d{stroke:var(--frame);stroke-dasharray:2 6}
        .l-py{fill:#60a5fa}.l-html{fill:#fb923c}.l-css{fill:#c084fc}
        .edge{fill:none}
        .edge-dep{stroke:var(--cy);stroke-width:1.5;opacity:.85}
        .edge-docs{stroke:var(--vio);stroke-width:1.5;stroke-dasharray:4 5;opacity:.85}
        .e-lbl{font-size:10.5px;fill:var(--dim)}
        @keyframes lnIn{from{opacity:0}to{opacity:1}}
        .ln{animation:lnIn .3s both;animation-delay:var(--d,0s)}
        @keyframes fadeD{from{opacity:0}to{opacity:.87}}
        .fade{animation:fadeD .5s both;animation-delay:var(--d,0s)}
        @keyframes draw{to{stroke-dashoffset:0}}
        .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards;animation-delay:var(--d,0s)}
        @keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .chip{animation:chipIn .4s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s)}
        @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
        .cur{fill:var(--fg);animation:blink 1.1s steps(1) infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .refresh{fill:var(--grn);transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
        @keyframes drift{to{transform:translateY(4px)}}
        .scan{animation:drift 8s linear infinite}
        @keyframes gl{0%,90%,100%{opacity:0;transform:none}91%{opacity:.8;transform:translate(-2px,1px)}93%{opacity:.55;transform:translate(2px,-1px)}95%{opacity:0;transform:none}}
        .g1{fill:var(--cy);opacity:0;animation:gl 7s infinite}
        .g2{fill:#ff5874;opacity:0;animation:gl 7s .08s infinite}
        @media (prefers-reduced-motion:reduce){.ln,.fade,.draw,.chip,.cur,.refresh,.scan,.g1,.g2{animation:none}.draw{stroke-dashoffset:0}}
      </style>

      <defs>
        <pattern id="gridp" width="26" height="26" patternUnits="userSpaceOnUse">
          <circle cx="13" cy="13" r="1" fill="#22d3ee" opacity=".05"/>
        </pattern>
        <pattern id="scanp" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="1" fill="#8be9fd" opacity=".035"/>
        </pattern>
        <marker id="mcy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/></marker>
        <marker id="mvio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c792ea"/></marker>
      </defs>

      <rect class="win" x="1" y="1" width="978" height="408" rx="14"/>
      <rect x="1" y="40" width="978" height="368" fill="url(#gridp)"/>

      <!-- title bar -->
      <circle cx="26" cy="20" r="5.5" fill="#ff5f56"/>
      <circle cx="46" cy="20" r="5.5" fill="#ffbd2e"/>
      <circle cx="66" cy="20" r="5.5" fill="#27c93f"/>
      <text class="t-title g1" x="490" y="24.5" text-anchor="middle">bee@hive:~/product-matrix/docs-portals — zsh</text>
      <text class="t-title g2" x="490" y="24.5" text-anchor="middle">bee@hive:~/product-matrix/docs-portals — zsh</text>
      <text class="t-title" x="490" y="24.5" text-anchor="middle">bee@hive:~/product-matrix/docs-portals — zsh</text>
      <rect x="836" y="10" width="122" height="20" rx="10" fill="#0f1e14" stroke="#238636" stroke-width="1"/>
      <text class="t-badge" x="897" y="23.5" text-anchor="middle">● DOMAIN VIEW</text>
      <line class="sep" x1="1" y1="40" x2="979" y2="40"/>

      <!-- boot lines -->
      <text class="ln cmd" style="--d:.1s" x="28" y="72"><tspan class="pr">❯</tspan> bee graph --org Mi-Bee-Studio --users xiqing85,mickeyzzc <tspan class="flag">--domain docs-portals</tspan></text>
      <rect class="cur" x="720" y="61" width="8" height="14"/>
      <text class="ln t-status" style="--d:.35s" x="28" y="96"><tspan class="t-ok">✓</tspan> resolved: 5 public repos · 1 relation edge · docs point back to the core matrix</text>
      <g class="ln" style="--d:.55s">
        <line x1="28" y1="114.5" x2="52" y2="114.5" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#mcy)"/>
        <text class="leg" x="60" y="118">theme 主题依赖</text>
        <line x1="178" y1="114.5" x2="202" y2="114.5" stroke="#c792ea" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#mvio)"/>
        <text class="leg" x="210" y="118">docs 文档 → 产品</text>
        <text class="leg" x="956" y="118" text-anchor="end"><tspan fill="#fbbf24">●</tspan> org ×2&#160;&#160;<tspan fill="#22d3ee">●</tspan> xiqing85 ×1&#160;&#160;<tspan fill="#c792ea">●</tspan> mickeyzzc ×2</text>
      </g>
      <line class="sep-d" x1="24" y1="150" x2="956" y2="150"/>

      <!-- ===== relations (drawn under chips) ===== -->
      <path class="edge edge-dep draw" style="--d:1.9s" pathLength="1" d="M708,226 L708,262" marker-end="url(#mcy)"/>
      <text class="ln e-lbl" style="--d:1.9s" x="718" y="248">theme</text>
      <path class="edge edge-docs fade" style="--d:2.0s" d="M144,226 L144,266" marker-end="url(#mvio)"/>
      <path class="edge edge-docs fade" style="--d:2.05s" d="M332,226 L332,266" marker-end="url(#mvio)"/>
      <path class="edge edge-docs fade" style="--d:2.1s" d="M520,226 L520,266" marker-end="url(#mvio)"/>

      <!-- ===== docs & portals ===== -->
      <text class="ln col-label" style="--d:.8s" x="60" y="174">// docs &amp; portals</text>
      <g transform="translate(60,190)"><g class="chip" style="--d:.9s"><rect class="box" width="168" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-html" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">org-pages</text></g></g>
      <g transform="translate(248,190)"><g class="chip" style="--d:.95s"><rect class="box" width="168" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-py" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">mibee-docs</text></g></g>
      <g transform="translate(436,190)"><g class="chip" style="--d:1.0s"><rect class="box" width="168" height="34" rx="7"/><rect class="own xq" width="3" height="34" rx="1.5"/><text class="lg l-html" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">eye-portal</text></g></g>
      <g transform="translate(624,190)"><g class="chip" style="--d:1.05s"><rect class="box" width="168" height="34" rx="7"/><rect class="own mz" width="3" height="34" rx="1.5"/><text class="lg l-html" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">mickeyzzc-blog</text></g></g>
      <g transform="translate(624,266)"><g class="chip" style="--d:1.1s"><rect class="box" width="168" height="34" rx="7"/><rect class="own mz" width="3" height="34" rx="1.5"/><text class="lg l-css" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">hugo-themes-zhi</text></g></g>

      <text class="ln lbl-note" style="--d:2.0s" x="144" y="286" text-anchor="middle">组织主页 · 全景</text>
      <text class="ln lbl-note" style="--d:2.05s" x="332" y="286" text-anchor="middle">产品手册 → 核心矩阵</text>
      <text class="ln lbl-note" style="--d:2.08s" x="332" y="304" text-anchor="middle">MiBeeNvr · MiBeeSteward · MiBeeBell</text>
      <text class="ln lbl-note" style="--d:2.1s" x="520" y="286" text-anchor="middle">MiBee Eye 门户</text>
      <text class="ln lbl-note" style="--d:1.2s" x="708" y="320" text-anchor="middle">Hugo 博客 · 纯 Hugo Pipes 主题</text>

      <!-- footer -->
      <line class="sep-d" x1="24" y1="342" x2="956" y2="342"/>
      <text class="ln f-line" style="--d:2.3s" x="28" y="366"><tspan class="t-ok">Σ</tspan> <tspan class="f-sum">5 public repos · 1 relation edge</tspan> · domain: docs &amp; portals</text>
      <text class="ln f-line" style="--d:2.3s" x="956" y="366" text-anchor="end"><tspan class="refresh">↻</tspan> synced 2026-11-02</text>
      <text class="ln f-line" style="--d:2.4s" x="28" y="388"><tspan class="pr">❯</tspan> <tspan class="cur-box">█</tspan></text>

      <rect class="scan" x="1" y="40" width="978" height="368" fill="url(#scanp)" pointer-events="none"/>
    </svg>
