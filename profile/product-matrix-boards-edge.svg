<svg class="tm" width="980" height="480" viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mi&amp;Bee Studio 专题视图 · 开发板与边缘：8 块开发板实验仓库，加 serialtap 与 wfp-device-sdk 两个边缘工具，共 10 个公开仓库、2 条关系边">
      <style>
        .tm{font-family:'Cascadia Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;
          --bg:#0b0f16;--panel:#10161f;--edgest:#26313f;--fg:#e6edf3;--dim:#7d8b99;--frame:#1f2733;
          --cy:#22d3ee;--grn:#3fb950;--amb:#fbbf24;--vio:#c792ea}
        .win{fill:var(--bg);stroke:var(--frame);stroke-width:1}
        .t-title{font-size:12px;fill:var(--dim)}
        .t-badge{font-size:10.5px;fill:var(--grn);letter-spacing:.5px}
        .cmd{font-size:13px;fill:var(--fg)}
        .pr{fill:var(--grn);font-weight:700}
        .flag{fill:var(--cy)}
        .t-status{font-size:12px;fill:var(--dim)}
        .t-ok{fill:var(--grn)}
        .leg{font-size:11.5px;fill:#8b98a5}
        .col-label{font-size:11px;fill:#5b8c6a}
        .lbl-note{font-size:11px;fill:var(--dim)}
        .chip .box{fill:var(--panel);stroke:var(--edgest);stroke-width:1}
        .chip .nm2{font-size:12px;fill:var(--fg)}
        .chip .lg{font-size:11px;font-weight:700}
        .own.org{fill:var(--amb)}.own.mz{fill:var(--vio)}
        .f-line{font-size:12px;fill:#8b98a5}
        .f-sum{fill:var(--fg);font-weight:700}
        .sep{stroke:var(--frame);stroke-width:1}
        .sep-d{stroke:var(--frame);stroke-dasharray:2 6}
        .l-go{fill:#00ADD8}.l-c{fill:#94a3b8}.l-cmake{fill:#f87171}
        .edge{fill:none}
        .edge-lin{stroke:var(--grn);stroke-width:1.5;stroke-dasharray:4 5;opacity:.85}
        .edge-ser{stroke:var(--cy);stroke-width:1.2;stroke-dasharray:3 3;opacity:.8}
        .e-lbl{font-size:10.5px;fill:var(--dim)}
        @keyframes lnIn{from{opacity:0}to{opacity:1}}
        .ln{animation:lnIn .3s both;animation-delay:var(--d,0s)}
        @keyframes fadeD{from{opacity:0}to{opacity:.87}}
        .fade{animation:fadeD .5s both;animation-delay:var(--d,0s)}
        @keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .chip{animation:chipIn .4s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s)}
        @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
        .cur{fill:var(--fg);animation:blink 1.1s steps(1) infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .refresh{fill:var(--grn);transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
        @keyframes drift{to{transform:translateY(4px)}}
        .scan{animation:drift 8s linear infinite}
        @keyframes gl{0%,90%,100%{opacity:0;transform:none}91%{opacity:.8;transform:translate(-2px,1px)}93%{opacity:.55;transform:translate(2px,-1px)}95%{opacity:0;transform:none}}
        .g1{fill:var(--cy);opacity:0;animation:gl 7s infinite}
        .g2{fill:#ff5874;opacity:0;animation:gl 7s .08s infinite}
        @media (prefers-reduced-motion:reduce){.ln,.fade,.chip,.cur,.refresh,.scan,.g1,.g2{animation:none}}
      </style>

      <defs>
        <pattern id="gridp" width="26" height="26" patternUnits="userSpaceOnUse">
          <circle cx="13" cy="13" r="1" fill="#22d3ee" opacity=".05"/>
        </pattern>
        <pattern id="scanp" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="1" fill="#8be9fd" opacity=".035"/>
        </pattern>
        <marker id="mcy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/></marker>
        <marker id="mgrn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#3fb950"/></marker>
      </defs>

      <rect class="win" x="1" y="1" width="978" height="478" rx="14"/>
      <rect x="1" y="40" width="978" height="438" fill="url(#gridp)"/>

      <!-- title bar -->
      <circle cx="26" cy="20" r="5.5" fill="#ff5f56"/>
      <circle cx="46" cy="20" r="5.5" fill="#ffbd2e"/>
      <circle cx="66" cy="20" r="5.5" fill="#27c93f"/>
      <text class="t-title g1" x="490" y="24.5" text-anchor="middle">bee@hive:~/product-matrix/boards-edge — zsh</text>
      <text class="t-title g2" x="490" y="24.5" text-anchor="middle">bee@hive:~/product-matrix/boards-edge — zsh</text>
      <text class="t-title" x="490" y="24.5" text-anchor="middle">bee@hive:~/product-matrix/boards-edge — zsh</text>
      <rect x="836" y="10" width="122" height="20" rx="10" fill="#0f1e14" stroke="#238636" stroke-width="1"/>
      <text class="t-badge" x="897" y="23.5" text-anchor="middle">● DOMAIN VIEW</text>
      <line class="sep" x1="1" y1="40" x2="979" y2="40"/>

      <!-- boot lines -->
      <text class="ln cmd" style="--d:.1s" x="28" y="72"><tspan class="pr">❯</tspan> bee graph --org Mi-Bee-Studio --users mickeyzzc <tspan class="flag">--domain boards-edge</tspan></text>
      <rect class="cur" x="636" y="61" width="8" height="14"/>
      <text class="ln t-status" style="--d:.35s" x="28" y="96"><tspan class="t-ok">✓</tspan> resolved: 10 public repos · 2 relation edges</text>
      <g class="ln" style="--d:.55s">
        <line x1="28" y1="114.5" x2="52" y2="114.5" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#mgrn)"/>
        <text class="leg" x="60" y="118">lineage 同源</text>
        <line x1="170" y1="114.5" x2="194" y2="114.5" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#mcy)"/>
        <text class="leg" x="202" y="118">serial 串口（典型链路）</text>
        <text class="leg" x="956" y="118" text-anchor="end"><tspan fill="#fbbf24">●</tspan> org ×8&#160;&#160;<tspan fill="#c792ea">●</tspan> mickeyzzc ×2</text>
      </g>
      <line class="sep-d" x1="24" y1="150" x2="956" y2="150"/>

      <!-- ===== relations (drawn under chips) ===== -->
      <!-- lineage: luatos-esp32c3/blackbox -> wfp-device-sdk -->
      <path class="edge edge-lin fade" style="--d:2.0s" d="M567,258 C 560,300 500,325 426,325" marker-end="url(#mgrn)"/>
      <text class="ln e-lbl" style="--d:2.0s" x="566" y="320">同源 · blackbox</text>
      <!-- serial: serialtap <-> boards (typical USB serial / esptool link) -->
      <path class="edge edge-ser fade" style="--d:2.1s" d="M135,304 L135,262" marker-end="url(#mcy)"/>
      <text class="ln e-lbl" style="--d:2.1s" x="145" y="276">USB serial · esptool</text>

      <!-- ===== board labs ===== -->
      <text class="ln col-label" style="--d:.8s" x="60" y="170">// board labs · org ×8</text>
      <g transform="translate(60,178)"><g class="chip" style="--d:.9s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">esp32-c3-mini</text></g></g>
      <g transform="translate(206,178)"><g class="chip" style="--d:.95s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">esp32-s2-mini</text></g></g>
      <g transform="translate(352,178)"><g class="chip" style="--d:1.0s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">esp32-s3-zero</text></g></g>
      <g transform="translate(498,178)"><g class="chip" style="--d:1.05s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">xiao-esp32c5</text></g></g>
      <g transform="translate(60,222)"><g class="chip" style="--d:1.1s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">xiao-esp32c6</text></g></g>
      <g transform="translate(206,222)"><g class="chip" style="--d:1.15s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">rp2040-zero</text></g></g>
      <g transform="translate(352,222)"><g class="chip" style="--d:1.2s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-cmake" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">xiao-rp2350</text></g></g>
      <g transform="translate(498,222)"><g class="chip" style="--d:1.25s"><rect class="box" width="138" height="34" rx="7"/><rect class="own org" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">luatos-esp32c3</text></g></g>

      <!-- what's inside the board repos -->
      <text class="ln col-label" style="--d:1.3s" x="680" y="170">// inside each board repo</text>
      <text class="ln lbl-note" style="--d:1.35s" x="680" y="196">blink 基线 · web OTA · TWDT 看门狗</text>
      <text class="ln lbl-note" style="--d:1.4s" x="680" y="218">env-station · 温湿度 / 光照 / WiFi CSI</text>
      <text class="ln lbl-note" style="--d:1.45s" x="680" y="240">blackbox · HTTP / TCP / DNS / ICMP 探测</text>

      <!-- ===== edge tooling ===== -->
      <text class="ln col-label" style="--d:1.5s" x="150" y="300">// edge tooling · @mickeyzzc</text>
      <g transform="translate(60,308)"><g class="chip" style="--d:1.55s"><rect class="box" width="150" height="34" rx="7"/><rect class="own mz" width="3" height="34" rx="1.5"/><text class="lg l-go" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">serialtap</text></g></g>
      <g transform="translate(244,308)"><g class="chip" style="--d:1.6s"><rect class="box" width="180" height="34" rx="7"/><rect class="own mz" width="3" height="34" rx="1.5"/><text class="lg l-c" x="12" y="22.5">▸</text><text class="nm2" x="24" y="22.5">wfp-device-sdk</text></g></g>

      <text class="ln lbl-note" style="--d:1.7s" x="60" y="374">serialtap：零接触 USB 串口中间件 —— 热插拔采集 · TCP 透明代理 · esptool 安全烧录</text>
      <text class="ln lbl-note" style="--d:1.75s" x="60" y="394">wfp-device-sdk：兼容 Prometheus blackbox_exporter 的 ESP32 网络探测设备（原 esp32-blackbox）</text>

      <!-- footer -->
      <line class="sep-d" x1="24" y1="420" x2="956" y2="420"/>
      <text class="ln f-line" style="--d:2.2s" x="28" y="444"><tspan class="t-ok">Σ</tspan> <tspan class="f-sum">10 public repos · 2 relation edges</tspan> · domain: boards &amp; edge</text>
      <text class="ln f-line" style="--d:2.2s" x="956" y="444" text-anchor="end"><tspan class="refresh">↻</tspan> synced 2026-11-02</text>
      <text class="ln f-line" style="--d:2.3s" x="28" y="466"><tspan class="pr">❯</tspan> <tspan class="cur-box">█</tspan></text>

      <rect class="scan" x="1" y="40" width="978" height="438" fill="url(#scanp)" pointer-events="none"/>
    </svg>
